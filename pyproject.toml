[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-normalize-fonts"
version = "2.0.0"
description = "Make EPUB books follow your e-reader's font and size settings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
epub-normalize-fonts = "epub_normalize_fonts:main"

[tool.setuptools]
py-modules = ["epub_normalize_fonts"]
